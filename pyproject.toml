[project]
name = "offball"
version = "0.1.0"
description = "OffBall: explainable off-ball match intelligence from synthetic football data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "pyarrow>=17",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sse-starlette>=2.1",
  "httpx>=0.28",
  # Agent Framework pins the MCP SDK to 1.x, so the OffBall MCP server uses FastMCP from 1.x too.
  "mcp>=1.24,<2",
  "agent-framework-core>=1.22",
  "agent-framework-openai>=1.17",
  "agent-framework-orchestrations>=1.3.2",
  "opentelemetry-api>=1.39",
  "optuna>=4.0",
  "opentelemetry-sdk>=1.39",
]

[project.optional-dependencies]
# Microsoft Foundry, the only Azure service OffBall uses (PRD 18.9): agents in Foundry Agent Service, and
# Microsoft Entra sign-in for the VM and CI (PRD 18.11).
azure = [
  "agent-framework-foundry>=1.15",
  "azure-identity>=1.19",
]
# What the VM adds (PRD 18.9): traces over OTLP to the Aspire Dashboard.
vm = [
  "opentelemetry-exporter-otlp-proto-grpc>=1.39",
]

[project.scripts]
offball = "offball.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["offball"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
