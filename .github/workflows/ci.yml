# The checks every change runs (PRD 18.13): lint and tests for the Python side and the frontend, the schema and
# truth checks (BE-1, BE-6, in tests/test_repo_checks.py) and the quality-gate report on the smoke set. Nothing here
# needs Azure or a model: agent tests use a test-only stand-in model.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The showcase parity test reads the frontend's match.ts with Node's --experimental-strip-types (22.6+).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --frozen
      - run: uv run ruff check offball tests
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:tokens
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=unit
        env:
          PW_CHANNEL: bundled
      - run: npm run build

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Gates 1, 2, 4 and 5 are reported against their targets rather than blocking (PRD 12.10), so the report is
      # published whatever it says; the release gates are also covered by the Python tests.
      - name: Quality gates on the smoke set
        run: uv run offball gates smoke --json || echo "Some reported gates miss their targets; see the report."
      - uses: actions/upload-artifact@v4
        with:
          name: gates-smoke
          path: calibration/reports/gates-smoke.*
